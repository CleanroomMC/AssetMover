import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
    id 'com.cleanroommc.conventions'
}

conventions {
    beginFrom = 2022
    repositoryUrl = 'https://github.com/CleanroomMC/AssetMover'
}

tokenEnvoy {
    set 'VERSION', project.version
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    extraRunJvmArguments.add('-ea:com.cleanroommc')
}

dependencies {
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.cleanroommc.assetmover.AssetMoverCore',
            'FMLCorePluginContainsFMLMod': true,
            'ForceLoadAsMod': true
        )
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Run Client'(Gradle) {
                    taskNames = ['runClient']
                }
                '2. Run Server'(Gradle) {
                    taskNames = ['runServer']
                }
                '3. Run Obfuscated Client'(Gradle) {
                    taskNames = ['runObfClient']
                }
                '4. Run Obfuscated Server'(Gradle) {
                    taskNames = ['runObfServer']
                }
            }
        }
    }
}
